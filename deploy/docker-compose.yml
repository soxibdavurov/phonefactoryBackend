# PhoneFactory: frontend + backend (+ ixtiyoriy Caddy)
# Serverda Caddy allaqachon 80/443 portlarda ishlayotgan bo'lsa (PM2'dagi caddy-proxy),
# shu Caddy'ga deploy/Caddyfile'dagi bloklarni qo'shing. Bu compose ichidagi Caddy
# faqat bo'sh serverda kerak:  docker compose --profile caddy up -d
# Baza MongoDB Atlas'da: ulanish manzili .env dagi MONGO_URL'da
#
# VPS'dagi papka tuzilishi:
#   ~/phonefactory/
#     phonefactorybackend/   (git clone)
#     phonefactory-react/    (git clone)
#     docker-compose.yml     (shu fayl)
#     Caddyfile
#     .env

services:
  backend:
    build: ./phonefactorybackend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3004
    volumes:
      - uploads:/app/uploads
    # Faqat serverning o'zidan (127.0.0.1) ochiq: tashqaridan Caddy orqali kiriladi
    ports:
      - "127.0.0.1:3004:3004"

  frontend:
    build:
      context: ./phonefactory-react
      args:
        REACT_APP_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:80"

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  uploads:
  caddy-data:
  caddy-config:
